name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: myproject
          environment-file: environment.yml
          auto-activate-base: false
      - name: Lint
        shell: bash -el {0}
        run: ruff check .
      - name: Test
        shell: bash -el {0}
        run: PYTHONPATH=src pytest -q
      - name: Build
        shell: bash -el {0}
        run: python -m build
